<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro - Controle de Escalas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Poppins", sans-serif;
      }
    </style>
  </head>
  <body class="bg-black text-white">
    <header class="bg-gray-800 text-white p-4">
      <h1 class="text-xl text-center select-none">Controle de Escalas</h1>
    </header>
    <div class="flex items-center justify-center min-h-screen">
      <div class="bg-gray-900 p-6 rounded shadow-lg max-w-md w-full">
        <h2 class="text-2xl font-semibold mb-4 text-center select-none">Cadastro</h2>
        <form id="registerForm" class="space-y-4">
          <div>
            <label for="name" class="block text-sm font-medium select-none">Nome</label>
            <input
              type="text"
              id="name"
              required
              class="w-full bg-gray-800 text-white p-2 rounded border border-gray-700 focus:outline-none focus:border-blue-500"
            />
          </div>
          <div>
            <label for="email" class="block text-sm font-medium select-none">Email</label>
            <input
              type="email"
              id="email"
              required
              class="w-full bg-gray-800 text-white p-2 rounded border border-gray-700 focus:outline-none focus:border-blue-500"
            />
            <p id="emailError" class="text-red-500 text-sm mt-1 hidden">Por favor, insira um e-mail válido (ex.: @gmail.com, @hotmail.com, @yahoo.com, @outlook.com).</p>
          </div>
          <div>
            <label for="cpf" class="block text-sm font-medium select-none">CPF</label>
            <input
              type="text"
              id="cpf"
              required
              placeholder="000.000.000-00"
              class="w-full bg-gray-800 text-white p-2 rounded border border-gray-700 focus:outline-none focus:border-blue-500"
            />
            <p id="cpfError" class="text-red-500 text-sm mt-1 hidden">Por favor, insira um CPF válido (ex.: 123.456.789-00).</p>
          </div>
          <div class="relative">
            <label for="password" class="block text-sm font-medium select-none">Senha</label>
            <input
              type="password"
              id="password"
              required
              class="w-full bg-gray-800 text-white p-2 rounded border border-gray-700 focus:outline-none focus:border-blue-500 pr-10"
            />
            <span
              id="togglePassword"
              class="absolute right-2 top-10 transform -translate-y-1/2 cursor-pointer text-gray-400"
            >
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </span>
          </div>
          <button
            type="submit"
            id="submitBtn"
            disabled
            class="w-full bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded select-none disabled:opacity-50 disabled:cursor-not-allowed"
            oncopy="return false;"
          >
            Cadastrar
          </button>
          <a
            href="login.html"
            class="block text-center text-blue-400 hover:underline select-none"
            oncopy="return false;"
            >Já tenho conta</a
          >
        </form>
      </div>
    </div>

    <script>
      document.getElementById("registerForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = document.getElementById("name").value;
        const email = document.getElementById("email").value;
        const cpf = document.getElementById("cpf").value;
        const password = document.getElementById("password").value;

        // Validação de CPF
        const cpfRegex = /^\d{3}\.\d{3}\.\d{3}-\d{2}$/;
        if (!cpfRegex.test(cpf)) {
          document.getElementById("cpfError").classList.remove("hidden");
          document.getElementById("cpf").classList.remove("border-gray-700", "focus:border-blue-500");
          document.getElementById("cpf").classList.add("border-red-500");
          return;
        }
        const API_BASE = window.location.origin;

        try {
          const response = await fetch(`${API_BASE}/register`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, email, password, cpf }),
          });
          const data = await response.json();
          if (response.ok) {
            alert("Cadastro realizado com sucesso!");
            window.location.href = "login.html";
          } else {
            alert(data.error);
          }
        } catch (error) {
          console.error("Erro:", error);
          alert("Falha ao cadastrar. Verifique o servidor.");
        }
      });

      const togglePassword = document.getElementById('togglePassword');
      const passwordInput = document.getElementById('password');

      togglePassword.addEventListener('click', () => {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        togglePassword.innerHTML = type === 'password' ?
          `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>` :
          `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;
      });

      // Bloquear cópia nos elementos específicos
      document.querySelectorAll('.select-none').forEach(element => {
        element.addEventListener('copy', (e) => {
          e.preventDefault();
          return false;
        });
      });

      // Validação de e-mail e CPF para habilitar/desabilitar o botão
      const emailInput = document.getElementById('email');
      const emailError = document.getElementById('emailError');
      const cpfInput = document.getElementById('cpf');
      const cpfError = document.getElementById('cpfError');
      const submitBtn = document.getElementById('submitBtn');

      function validateForm() {
        const email = emailInput.value;
        const cpf = cpfInput.value;
        const emailRegex = /^[^\s@]+@(gmail\.com|hotmail\.com|yahoo\.com|outlook\.com)$/i;
        const cpfRegex = /^\d{3}\.\d{3}\.\d{3}-\d{2}$/;

        const isEmailValid = emailRegex.test(email);
        const isCpfValid = cpfRegex.test(cpf);

        if (!isEmailValid) {
          emailInput.classList.remove('border-gray-700', 'focus:border-blue-500');
          emailInput.classList.add('border-red-500');
          emailError.classList.remove('hidden');
        } else {
          emailInput.classList.remove('border-red-500');
          emailInput.classList.add('border-gray-700', 'focus:border-blue-500');
          emailError.classList.add('hidden');
        }

        if (!isCpfValid) {
          cpfInput.classList.remove('border-gray-700', 'focus:border-blue-500');
          cpfInput.classList.add('border-red-500');
          cpfError.classList.remove('hidden');
        } else {
          cpfInput.classList.remove('border-red-500');
          cpfInput.classList.add('border-gray-700', 'focus:border-blue-500');
          cpfError.classList.add('hidden');
        }

        submitBtn.disabled = !(isEmailValid && isCpfValid);
      }

      emailInput.addEventListener('input', validateForm);
      cpfInput.addEventListener('input', validateForm);
    </script>
  </body>
</html>
